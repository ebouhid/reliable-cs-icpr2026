[project]
name = "reliable-cs"
version = "0.1.0"
description = "Reproducible SVM experiments for citizen-science deforestation labeling (ICPR 2026 companion)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliable_cs"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.11.*"
pandas = "*"
numpy = "*"
scikit-learn = "*"
imbalanced-learn = "*"
matplotlib = "*"

[tool.pixi.pypi-dependencies]
reliable-cs = { path = ".", editable = true }

[tool.pixi.tasks]
run-landsat = "python -m reliable_cs --campaign landsat"
run-sentinel = "python -m reliable_cs --campaign sentinel"
reproduce = { depends-on = ["run-landsat", "run-sentinel"] }
